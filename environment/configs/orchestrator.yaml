model_configs:
  case_intake: environment/model_configs/bedrock-aws-nova-pro.yaml
  # One path for all three document-screening model calls, or one path per call.
  document_screening:
    prioritization: environment/model_configs/bedrock-aws-gemma-3-27b.yaml
    pre_screening: environment/model_configs/bedrock-aws-gemma-3-27b.yaml
    screening: environment/model_configs/bedrock-aws-gemma-3-27b.yaml
  spatial_screening: environment/model_configs/bedrock-aws-gpt-oss-120b.yaml

required_fields:
  case_intake:
    - lpa_reference_id                    # For document screening
    - lpa_website                         # For document screening 
    - signals.eia_screening               # For decision
    - signals.eia_scoping                 # For decision
    - signals.conditions                  # For decision
    - signals.pre_application             # For decision
    - signals.prior_approval              # For decision
    - signals.minerals_waste_existing     # For decision
    - signals.minerals_waste_new          # For decision
  document_screening:
    - polygon                             # For spatial screening
  spatial_screening:
    - geospatial_checks.best_and_most_versatile_land
    - answers
  decision:
    - classification
    - checklist
