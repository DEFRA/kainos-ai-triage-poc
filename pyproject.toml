[project]
name = "ai-triage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.12"
dependencies = [
    "boto3>=1.35.0",
    "bs4>=0.0.2",
    "fiona>=1.9",
    "ipykernel>=6.31.0",
    "openai>=1.55.0",
    "pandas>=2.3.3",
    "pillow>=11.0.0",
    "python-dotenv>=1.0.0",
    "pypdfium2>=4.30.0,<6",
    "pyproj>=3.6.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "shapely>=2.0",
    "pdfplumber>=0.11.10",
    "extract-msg>=0.58.0",
    "streamlit>=1.66.0",
    "python-docx>=1.2.0"
]

[project.scripts]
ai-triage = "ai_triage:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["ai_triage", "spatial_screening", "shared", "document_screening"]
